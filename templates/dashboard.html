{% extends 'base.html' %}

{% block content %}
<div class="row fade-in g-4">
    <div class="col-lg-12">
        <div class="mb-5">
            <h1 class="fw-bold mb-2">Welcome back, <span class="text-primary">{{ user.username }}</span>!</h1>
            <p class="text-secondary">Explore new skills and continue your learning journey.</p>
        </div>
        
        
        <div class="mb-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">Explore <span class="text-primary">Domains</span></h4>
                <div class="badge-glass px-3 py-1 rounded-pill small">9 Total Categories</div>
            </div>
            <div class="row g-3">
                {% for d in all_domains %}
                <div class="col-md-4">
                    <div class="card domain-card">
                        <i class="{{ d.icon }} domain-icon" style="color: {{ d.color }}"></i>
                        <div class="fw-semibold">{{ d.name }}</div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<style>
    .border-dashed { border-style: dashed !important; }
.last-child-no-border:last-child { border: none !important; margin: 0 !important; padding: 0 !important; }
</style>
{% endblock %}
